name: Build MSIX

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PACKAGE_PROJECT: VMAzureApp.Package\VMAzureApp.Package.wapproj
  MANIFEST_PATH: VMAzureApp.Package\Package.appxmanifest
  PACKAGE_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
  PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
  PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}

jobs:
  build-msix:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Resolve package version and publisher
        shell: pwsh
        run: |
          $rawVersion = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0" }
          $parts = $rawVersion.Split(".")
          while ($parts.Count -lt 4) { $parts += "0" }
          $version = ($parts[0..3] -join ".")
          $publisher = if ([string]::IsNullOrWhiteSpace($env:PACKAGE_PUBLISHER)) { "CN=9C5245CA-C92C-4BF3-8E4D-810F66F8811F" } else { $env:PACKAGE_PUBLISHER }

          [xml]$manifest = Get-Content $env:MANIFEST_PATH
          $manifest.Package.Identity.Version = $version
          $manifest.Package.Identity.Publisher = $publisher

          $settings = [System.Xml.XmlWriterSettings]::new()
          $settings.Encoding = [System.Text.UTF8Encoding]::new($false)
          $settings.Indent = $true
          $writer = [System.Xml.XmlWriter]::Create($env:MANIFEST_PATH, $settings)
          try {
            $manifest.Save($writer)
          } finally {
            $writer.Dispose()
          }

          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EFFECTIVE_PUBLISHER=$publisher" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare signing certificate
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "AzureVMManager.msix.pfx"
          $password = if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            [System.Guid]::NewGuid().ToString("N")
          } else {
            $env:PFX_PASSWORD
          }

          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject $env:EFFECTIVE_PUBLISHER `
              -KeyUsage DigitalSignature `
              -FriendlyName "Cloud VM Manager MSIX Signing" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
            Export-PfxCertificate -Cert $cert -FilePath $certPath -Password $securePassword | Out-Null
          } else {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:PFX_BASE64))
          }

          "CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CERT_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore
        run: dotnet restore .\VMAzureApp\VMAzureApp.csproj

      - name: Build MSIX
        shell: pwsh
        run: |
          msbuild $env:PACKAGE_PROJECT `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:CERT_PATH" `
            /p:PackageCertificatePassword="$env:CERT_PASSWORD"

      - name: Collect package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts\package -Force | Out-Null
          $packages = Get-ChildItem -Path VMAzureApp.Package\AppPackages -Recurse -Include *.msix,*.msixbundle,*.appinstaller,*.cer
          if ($packages.Count -eq 0) {
            Get-ChildItem -Path VMAzureApp.Package\AppPackages -Recurse | Select-Object FullName
            throw "No MSIX package files were found."
          }

          $packages | Copy-Item -Destination artifacts\package

          @'
          $ErrorActionPreference = "Stop"

          $packageDirectory = Split-Path -Parent $MyInvocation.MyCommand.Path
          $certificate = Get-ChildItem -Path $packageDirectory -Filter *.cer | Select-Object -First 1
          $package = Get-ChildItem -Path $packageDirectory -File |
            Where-Object { $_.Extension -in ".msix", ".msixbundle" } |
            Select-Object -First 1

          if ($null -eq $certificate) {
              throw "No certificate file (*.cer) was found next to this script."
          }

          if ($null -eq $package) {
              throw "No app package (*.msix or *.msixbundle) was found next to this script."
          }

          Write-Host "Trusting certificate for the current user..."
          Import-Certificate -FilePath $certificate.FullName -CertStoreLocation Cert:\CurrentUser\TrustedPeople | Out-Null

          Write-Host "Installing Cloud VM Manager..."
          Add-AppxPackage -Path $package.FullName

          Write-Host "Cloud VM Manager installed successfully."
          '@ | Set-Content -Path artifacts\package\Install-AzureVMManager.ps1 -Encoding UTF8

          Copy-Item artifacts\package\* -Destination artifacts
          Compress-Archive -Path artifacts\package\* -DestinationPath "artifacts\AzureVMManager-MSIX-$env:PACKAGE_VERSION.zip" -Force
          Remove-Item artifacts\package -Recurse -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzureVMManager-MSIX-${{ env.PACKAGE_VERSION }}
          path: |
            artifacts\*.msix
            artifacts\*.cer
            artifacts\*.ps1
            artifacts\*.zip

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts\*.msix
            artifacts\*.cer
            artifacts\*.ps1
            artifacts\*.zip
          body: |
            Download `AzureVMManager-MSIX-${{ env.PACKAGE_VERSION }}.zip`, extract it, then run `Install-AzureVMManager.ps1`.

            The package is signed. If this release was built without a trusted code-signing certificate, Windows requires trusting the included `.cer` certificate for the current user before installing the `.msix`.
